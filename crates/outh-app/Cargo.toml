[package]
name = "outh-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Outh — Google Photos uploader for Windows (WinUI 3 via windows-reactor)"

[[bin]]
name = "outh"
path = "src/main.rs"

[dependencies]
outh-core = { path = "../outh-core" }
windows-reactor = { workspace = true }
windows-pickers = { workspace = true, features = ["reactor"] }

[build-dependencies]
windows-reactor-setup = { workspace = true }
